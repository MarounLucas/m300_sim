<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | simulador_m350</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <!-- CSS INJETADO: Força Fullscreen nativo no PySide6 e esconde rodapés -->
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #2b2b2b;
        overflow: hidden;
      }
      #unity-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
      }
      #unity-footer {
        display: none !important;
      }
    </style>

    <!-- BIBLIOTECAS DO ROS 2 WEB BRIDGE -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">simulador_m350</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      // Mantendo os nomes gerados pelo seu último build ("novo_simulador")
      var loaderUrl = buildUrl + "/novo_simulador.loader.js";
      var config = {
        dataUrl: buildUrl + "/novo_simulador.data",
        frameworkUrl: buildUrl + "/novo_simulador.framework.js",
        codeUrl: buildUrl + "/novo_simulador.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "simulador_m350",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          if (fullscreenButton) {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }

          // =================================================================
          // INTEGRAÇÃO ROS 2 WEBSOCKET -> UNITY
          // =================================================================
          var ros = new ROSLIB.Ros({ url : 'ws://127.0.0.1:9090' });

          ros.on('connection', function() { console.log('WebBridge: Conectado ao ROS 2.'); });
          ros.on('error', function(error) { console.log('WebBridge Erro: ', error); });

          let latestOdom = {x: 0, y: 0, z: 0, roll: 0, pitch: 0, yaw: 0};
          let latestMotors = {w1: 0, w2: 0, w3: 0, w4: 0};

          function quaternionToEuler(q) {
              let sinr_cosp = 2 * (q.w * q.x + q.y * q.z);
              let cosr_cosp = 1 - 2 * (q.x * q.x + q.y * q.y);
              let roll = Math.atan2(sinr_cosp, cosr_cosp);

              let sinp = Math.sqrt(1 + 2 * (q.w * q.y - q.x * q.z));
              let cosp = Math.sqrt(1 - 2 * (q.w * q.y - q.x * q.z));
              let pitch = 2 * Math.atan2(sinp, cosp) - Math.PI / 2;

              let siny_cosp = 2 * (q.w * q.z + q.x * q.y);
              let cosy_cosp = 1 - 2 * (q.y * q.y + q.z * q.z);
              let yaw = Math.atan2(siny_cosp, cosy_cosp);

              return {roll: roll, pitch: pitch, yaw: yaw};
          }

          var odomListener = new ROSLIB.Topic({
            ros : ros, name : '/m300_sim/telemetry_topic', messageType : 'nav_msgs/Odometry'
          });

          odomListener.subscribe(function(message) {
            latestOdom.x = message.pose.pose.position.x;
            latestOdom.y = message.pose.pose.position.y;
            latestOdom.z = message.pose.pose.position.z;
            
            let euler = quaternionToEuler(message.pose.pose.orientation);
            latestOdom.roll = euler.roll;
            latestOdom.pitch = euler.pitch;
            latestOdom.yaw = euler.yaw;

            let dataStr = `${latestOdom.x},${latestOdom.y},${latestOdom.z},${latestOdom.roll},${latestOdom.pitch},${latestOdom.yaw},${latestMotors.w1},${latestMotors.w2},${latestMotors.w3},${latestMotors.w4}`;
            
            // O nome do objeto idêntico ao da Hierarchy da Unity ("matrice_v16")
            unityInstance.SendMessage("matrice_v16", "ReceiveTelemetry", dataStr);
          });

          var motorListener = new ROSLIB.Topic({
            ros : ros, name : '/m300_sim/joint_states', messageType : 'sensor_msgs/JointState'
          });

          motorListener.subscribe(function(message) {
            if (message.velocity && message.velocity.length >= 4) {
                latestMotors.w1 = message.velocity[0];
                latestMotors.w2 = message.velocity[1];
                latestMotors.w3 = message.velocity[2];
                latestMotors.w4 = message.velocity[3];
            }
          });

        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
